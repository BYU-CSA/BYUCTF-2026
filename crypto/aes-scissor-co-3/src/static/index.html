<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AES Scissor Company</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
        }
        header {
            background: #343a40;
            color: #fff;
            padding: 1rem 2rem;
            position: relative;
            text-align: center;
        }
        .auth-buttons {
            position: absolute;
            top: 1rem;
            right: 2rem;
        }
        .auth-buttons a {
            background: #007bff;
            color: #fff;
            padding: 0.5rem 1rem;
            margin-left: 0.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s ease-in-out;
        }
        .auth-buttons a:hover {
            background: #0056b3;
        }
        main {
            padding: 2rem;
            text-align: center;
        }
        .product {
            background: #fff;
            padding: 1rem;
            margin: 1rem auto;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="auth-buttons">
            <a href="login">Login</a>
            <a href="register">Register</a>
        </div>
        <h1>AES Scissor Company</h1>
        <p>Welcome! ✂️ Cut with precision</p>
    </header>
    <main>
        <div class="product">
            <h2>Professional Hair Scissors</h2>
            <p>Sharp, ergonomic, perfect for salons.</p>
        </div>
        <div class="product">
            <h2>Office Scissors</h2>
            <p>Reliable scissors for everyday office tasks.</p>
        </div>
        <div class="product">
            <h2>Fabric Scissors</h2>
            <p>Durable scissors designed for textiles.</p>
        </div>
    </main>
</body>
</html>
