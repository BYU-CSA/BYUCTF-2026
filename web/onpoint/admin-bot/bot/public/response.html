<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Submitted - Unhackable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 50px 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    .success-icon {
      font-size: 5em;
      margin-bottom: 25px;
      animation: bounceIn 0.6s ease-out;
    }

    h2 {
      color: #667eea;
      font-size: 2em;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .message {
      color: #666;
      font-size: 1.1em;
      margin-bottom: 30px;
    }

    .info-box {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 20px;
      border-radius: 8px;
      text-align: left;
      margin-top: 20px;
    }

    .info-box p {
      color: #555;
      line-height: 1.6;
      margin: 0;
    }

    .info-box strong {
      color: #667eea;
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 25px;
      }

      h2 {
        font-size: 1.5em;
      }

      .success-icon {
        font-size: 4em;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="success-icon">✅</div>
      <h2>Report Submitted Successfully!</h2>
      <p class="message">An admin will be viewing your link shortly!</p>
      
      <div class="info-box">
        <p><strong>⏱️ What happens next?</strong></p>
        <p>Our admin team will review the URL you submitted and investigate any issues you've reported.</p>
      </div>
    </div>
  </div>
</body>
</html>
