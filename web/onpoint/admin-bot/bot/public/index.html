<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Posts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: white;
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header h2 {
      color: white;
      font-size: 1.5em;
      font-weight: normal;
      margin-bottom: 15px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    .header h4 {
      color: rgba(255,255,255,0.9);
      font-size: 1.1em;
      font-weight: normal;
      font-style: italic;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    form {
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 0;
    }

    .searchTerm {
      width: 100%;
      padding: 18px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 25px 0 0 25px;
      font-size: 1.1em;
      font-family: inherit;
      transition: border-color 0.3s ease;
      outline: none;
    }

    .searchTerm:focus {
      border-color: #667eea;
    }

    .searchButton {
      padding: 18px 35px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 0 25px 25px 0;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .searchButton:hover {
      background: #5568d3;
      transform: translateX(2px);
    }

    .searchButton i {
      font-style: normal;
    }

    .icon {
      margin-bottom: 20px;
      font-size: 4em;
      text-align: center;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 2em;
      }
      
      .header h2 {
        font-size: 1.2em;
      }

      .card {
        padding: 25px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🚨 Issues?</h1>
      <h2>TOO BAD!!!</h2>
      <h3>Just Kidding</h3>
      <h2>Report them to the site admin here!</h2>
    </div>
    
    <div class="card">
      <div class="icon">🔗</div>
      <form action="/report" method="post">
        <table>
          <tr>
            <td style="width: 100%;">
              <input type="url" class="searchTerm" name="url" placeholder="Enter the URL to report...">
            </td>
            <td>
              <button type="submit" class="searchButton"><i>Submit</i></button>
            </td>
          </tr>
        </table>
      </form>
    </div>
  </div>
</body>
</html>
