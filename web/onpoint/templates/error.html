<!DOCTYPE html>
<html>
<head>
    <title>Error - Unhackable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .error-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        h1 {
            color: #e74c3c;
            font-size: 2em;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-details {
            background: #fff5f5;
            border-left: 4px solid #e74c3c;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: left;
        }

        .error-details h3 {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .error-details ul {
            color: #666;
            padding-left: 20px;
        }

        .error-details li {
            margin-bottom: 5px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .icon {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="error-icon">🔒</div>
            <h1>Security Check Failed!</h1>
            <p>Your request was blocked by our advanced security system.</p>
            
            <div class="error-details">
                <h3>🛡️ What might have caused this?</h3>
                <ul>
                    <li>Potentially malicious content detected</li>
                    <li>Invalid characters in your input</li>
                    <li>Security filter triggered</li>
                </ul>
            </div>
            
            <a href="/" class="btn"><span class="icon">🏠</span>Return to Home</a>
        </div>
    </div>
</body>
</html>
