<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Your Cat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        .form-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create Your Cat</h2>
        <form id="catForm">
            <input type="text" id="name" placeholder="Cat's Name" required>
            <input type="number" id="age" placeholder="Age" min="0" required>
            <input type="text" id="color" placeholder="Color" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("catForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const data = {
                name: document.getElementById("name").value,
                age: parseInt(document.getElementById("age").value),
                color: document.getElementById("color").value,
            };

            try {
                const response = await fetch("/cat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                if (response.redirected) {
                    // If backend responds with a redirect, follow it
                    window.location.href = response.url;
                } else {
                    // If backend renders directly, we can replace page content
                    const html = await response.text();
                    document.open();
                    document.write(html);
                    document.close();
                }
            } catch (err) {
                alert("Error submitting cat: " + err);
            }
        });
    </script>
</body>
</html>
